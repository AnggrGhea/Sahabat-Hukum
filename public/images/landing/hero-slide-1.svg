<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1526"/>
      <stop offset="50%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb76c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c5a059" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="archGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bgGrad1)"/>
  <rect width="1600" height="900" fill="url(#archGrid)"/>
  <!-- Architectural Law Boardroom perspective lines -->
  <path d="M 0,900 L 500,450 L 1100,450 L 1600,900 Z" fill="rgba(10,21,38,0.7)"/>
  <path d="M 500,450 L 500,100 L 1100,100 L 1100,450 Z" fill="rgba(17,34,64,0.4)"/>
  <!-- Boardroom conference table geometry -->
  <polygon points="560,520 1040,520 1200,850 400,850" fill="url(#goldAcc)" stroke="rgba(212,175,55,0.3)" stroke-width="2"/>
  <!-- Ambient glow circles -->
  <circle cx="800" cy="300" r="280" fill="none" stroke="rgba(212,175,55,0.08)" stroke-width="1.5"/>
  <circle cx="800" cy="300" r="180" fill="none" stroke="rgba(212,175,55,0.12)" stroke-width="1"/>
  <!-- Scales of justice watermark subtle -->
  <g transform="translate(730, 230) scale(1.4)" opacity="0.18">
    <path d="M50 15 L50 85 M20 25 L80 25 M30 85 L70 85" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
    <path d="M20 25 L10 55 Q20 62 30 55 Z" fill="none" stroke="#d4af37" stroke-width="2"/>
    <path d="M80 25 L70 55 Q80 62 90 55 Z" fill="none" stroke="#d4af37" stroke-width="2"/>
  </g>
  <text x="800" y="700" font-family="'Inter', sans-serif" font-size="20" fill="rgba(255,255,255,0.3)" text-anchor="middle" letter-spacing="4">SAHABAT HUKUM — EXECUTIVE BOARDROOM &amp; CONSULTATION</text>
</svg>
