<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2e"/>
      <stop offset="60%" stop-color="#162c4a"/>
      <stop offset="100%" stop-color="#223d63"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfb76c"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="800" fill="url(#aboutBg)"/>
  <!-- Law office interior visualization -->
  <g stroke="rgba(212,175,55,0.2)" stroke-width="1.5" fill="none">
    <rect x="80" y="80" width="840" height="640" rx="16" stroke="rgba(212,175,55,0.3)"/>
    <line x1="80" y1="280" x2="920" y2="280"/>
    <line x1="80" y1="480" x2="920" y2="480"/>
    <!-- Law books row -->
    <rect x="120" y="120" width="50" height="130" fill="rgba(212,175,55,0.15)"/>
    <rect x="180" y="100" width="45" height="150" fill="rgba(212,175,55,0.2)"/>
    <rect x="235" y="130" width="40" height="120" fill="rgba(212,175,55,0.1)"/>
    <rect x="285" y="110" width="55" height="140" fill="rgba(212,175,55,0.18)"/>
  </g>
  <!-- Seal of Justice emblem -->
  <circle cx="500" cy="480" r="110" fill="rgba(10,21,38,0.7)" stroke="url(#goldGlow)" stroke-width="3"/>
  <circle cx="500" cy="480" r="95" fill="none" stroke="rgba(212,175,55,0.3)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <g transform="translate(460, 435) scale(0.8)">
    <path d="M50 15 L50 85 M20 25 L80 25 M30 85 L70 85" stroke="#dfb76c" stroke-width="4" stroke-linecap="round"/>
    <path d="M20 25 L10 55 Q20 62 30 55 Z" fill="none" stroke="#dfb76c" stroke-width="3"/>
    <path d="M80 25 L70 55 Q80 62 90 55 Z" fill="none" stroke="#dfb76c" stroke-width="3"/>
  </g>
  <text x="500" y="660" font-family="'Inter', sans-serif" font-size="18" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="3">KANTOR HUKUM SAHABAT HUKUM</text>
  <text x="500" y="690" font-family="'Inter', sans-serif" font-size="13" fill="#dfb76c" text-anchor="middle" letter-spacing="2">DEDIKASI, INTEGRITAS &amp; KEPASTIAN HUKUM</text>
</svg>
